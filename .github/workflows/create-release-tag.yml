name: Create release tag
run-name: Create ${{ inputs.type }} tag

# The only supported way to create v* release tags. The tag name comes from package.json, so a
# release can never be tagged with a version that differs from the code it ships. The tag
# ruleset lets only the release-tag GitHub App create v* tags; see infra/github/rulesets.tf.
on:
  workflow_dispatch:
    inputs:
      type:
        description: Release to create
        required: true
        type: choice
        options:
          - release-candidate
          - stable
      commit:
        description: Commit on main for a release candidate (default is the latest main commit). Ignored for stable releases, which tag the latest release candidate.
        required: false
        type: string

# Serialize tag creation so two runs cannot claim the same release-candidate number.
concurrency:
  group: create-release-tag
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  create:
    name: Create ${{ inputs.type }} tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment only admits runs from main, so a modified copy of this workflow on another
    # branch cannot read the GitHub App key.
    environment: release-tagging
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Plan the release tag
        id: plan
        env:
          RELEASE_TYPE: ${{ inputs.type }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          node scripts/plan-release-tag.mjs \
            --type "$RELEASE_TYPE" \
            --commit "$RELEASE_COMMIT" \
            --github-output "$GITHUB_OUTPUT"

      # Release tags cannot be deleted, so refuse a tag the Release workflow would reject rather
      # than use up its version. Release runs the same checks again after the tag is created. This
      # runs before the next step checks out the release commit, so the checks come from main.
      - name: Check the commit is ready to release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TYPE: ${{ inputs.type == 'stable' && 'stable' || 'rc' }}
          RELEASE_SHA: ${{ steps.plan.outputs.sha }}
          RC_TAG: ${{ steps.plan.outputs.rc_tag }}
        with:
          script: |
            const { checkReleaseReadiness } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/lib/release-readiness.mjs`
            );
            await checkReleaseReadiness({
              github,
              ...context.repo,
              type: process.env.RELEASE_TYPE,
              commitSha: process.env.RELEASE_SHA,
              rcTag: process.env.RC_TAG
            });

      - name: Validate the tag against the tagged commit
        env:
          RELEASE_SHA: ${{ steps.plan.outputs.sha }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git checkout --detach "$RELEASE_SHA"
          npm run --silent release:validate-tag -- --tag "$RELEASE_TAG"

      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_TAG_APP_ID }}
          private-key: ${{ secrets.RELEASE_TAG_APP_PRIVATE_KEY }}
          permission-contents: write

      # Tags created with GITHUB_TOKEN do not start other workflows, so the App token is also what
      # lets the new tag trigger the Release workflow.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SHA: ${{ steps.plan.outputs.sha }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_SHA" > /dev/null
          {
            echo "### Created \`$RELEASE_TAG\`"
            echo
            echo "Commit: \`$RELEASE_SHA\`. The Release workflow now validates and deploys it."
          } >> "$GITHUB_STEP_SUMMARY"
