name: Main UAT

on:
  push:
    branches:
      - main

concurrency:
  group: integration-uat
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and retain artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: vendor/kql-to-sql/global.json

      - name: Restore the WebAssembly workload
        working-directory: vendor/kql-to-sql
        run: dotnet workload restore src/KqlWasmBridge/KqlWasmBridge.csproj

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Calculate the Kusto documentation cache key
        id: kusto_docs_cache_key
        env:
          DOCUMENTATION_HASH: ${{ hashFiles('data/kusto-documentation-index.json', 'scripts/download-kusto-documentation.mjs', 'scripts/lib/kusto-documentation.mjs') }}
        run: echo "value=kusto-docs-${RUNNER_OS}-$(date -u +%G-%V)-${DOCUMENTATION_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore generated Kusto documentation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: static/kusto-docs
          key: ${{ steps.kusto_docs_cache_key.outputs.value }}

      - name: Install dependencies
        run: npm ci

      - name: Build the KQL translator WebAssembly
        run: npm run build:kql-wasm

      - name: Install the Playwright browser
        run: npm run test:e2e:install

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Validate and build
        run: npm run test:ci

      - name: Validate the Cloudflare deployment bundle
        run: |
          test -f .svelte-kit/cloudflare/_worker.js
          test -f .svelte-kit/cloudflare-tmp/manifest.js
          test -f .svelte-kit/output/server/index.js
          test -f .svelte-kit/tsconfig.json
          test -f .svelte-kit/cloudflare/kql-wasm/_framework/dotnet.js
          oversized_file="$(find .svelte-kit/cloudflare -type f -size +25M -print -quit)"
          test -z "$oversized_file" || {
            echo "Cloudflare Pages limit exceeded (25 MiB): $oversized_file" >&2
            exit 1
          }

      - name: Upload the release artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kite-pages-${{ github.sha }}
          path: |
            .svelte-kit/cloudflare
            .svelte-kit/cloudflare-tmp
            .svelte-kit/output/server
            .svelte-kit/tsconfig.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Record the GitHub artifact digest
        run: echo "Artifact digest ${{ steps.artifact.outputs.artifact-digest }}"

  deploy-uat:
    name: Deploy integration UAT
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: integration-uat
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependencies
        run: npm ci --ignore-scripts

      - name: Download the release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: site
          digest-mismatch: error

      - name: Validate UAT configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Apply the GitHub Terraform to set the repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN integration-uat environment secret}"
          : "${CLOUDFLARE_PAGES_BRANCH:?Set the CLOUDFLARE_PAGES_BRANCH integration-uat environment variable}"
          : "${CLOUDFLARE_PAGES_PROJECT_NAME:?Apply the GitHub Terraform to set the repository variable}"

      - name: Deploy integration UAT
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: >-
            pages deploy site/cloudflare
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=${{ vars.CLOUDFLARE_PAGES_BRANCH }}
            --commit-hash=${{ github.sha }}
            --commit-message="Integration UAT ${{ github.sha }}"
            --commit-dirty=false

      - name: Smoke test integration UAT
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run test:smoke -- --url "$DEPLOYMENT_URL"
