name: Preview
run-name: Preview PR from ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows:
      - Pull Request
    types:
      - completed

concurrency:
  group: preview-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve validated pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.pr.outputs.deploy }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      number: ${{ steps.pr.outputs.number }}
      run_id: ${{ steps.pr.outputs.run_id }}

    steps:
      - name: Verify the pull request is current and internal
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const association = run.pull_requests?.[0];

            core.setOutput('deploy', 'false');

            if (!association) {
              core.notice(`Workflow run ${run.id} is not associated with a pull request.`);
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: association.number
            });

            const isCurrentInternalPullRequest =
              pullRequest.state === 'open' &&
              pullRequest.base.ref === 'main' &&
              pullRequest.head.repo?.full_name === `${owner}/${repo}` &&
              pullRequest.head.sha === run.head_sha;

            if (!isCurrentInternalPullRequest) {
              core.notice(
                `Skipping workflow run ${run.id}: its pull request is closed, external, targets another branch, or has a newer revision.`
              );
              return;
            }

            core.setOutput('deploy', 'true');
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('number', String(pullRequest.number));
            core.setOutput('run_id', String(run.id));

  deploy:
    name: Deploy preview
    if: needs.resolve.outputs.deploy == 'true'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      deployment: false
    permissions:
      actions: read
      contents: read
      deployments: write

    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install trusted deployment dependencies
        run: npm ci --ignore-scripts

      - name: Download the validated preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kite-preview
          path: site
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          digest-mismatch: error

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Apply the GitHub Terraform to set the repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN preview environment secret}"
          : "${CLOUDFLARE_PAGES_PROJECT_NAME:?Apply the GitHub Terraform to set the repository variable}"

      - name: Create the pull request deployment
        id: github-deployment
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a # v2.0.8
        with:
          token: ${{ github.token }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          initial-status: in_progress
          environment: preview
          description: Preview PR #${{ needs.resolve.outputs.number }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          auto-merge: false
          transient-environment: true
          production-environment: false
          auto-inactive: false
          payload: >-
            {"pull_request":${{ needs.resolve.outputs.number }},"workflow_run":${{ github.run_id }}}

      - name: Deploy the preview
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: >-
            pages deploy site/cloudflare
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=pr-${{ needs.resolve.outputs.number }}
            --commit-hash=${{ needs.resolve.outputs.head_sha }}
            --commit-message="Preview PR #${{ needs.resolve.outputs.number }}"
            --commit-dirty=false

      - name: Mark the pull request deployment successful
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2.0.4
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.github-deployment.outputs.deployment_id }}
          state: success
          environment: preview
          environment-url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: Preview deployment succeeded
          auto-inactive: false

      - name: Mark the pull request deployment failed
        if: failure() && steps.github-deployment.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2.0.4
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.github-deployment.outputs.deployment_id }}
          state: failure
          environment: preview
          log-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: Preview deployment failed
          auto-inactive: false
