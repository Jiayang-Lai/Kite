name: Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the prospective merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: vendor/kql-to-sql/global.json

      - name: Restore the WebAssembly workload
        working-directory: vendor/kql-to-sql
        run: dotnet workload restore src/KqlWasmBridge/KqlWasmBridge.csproj

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/github fmt -check -recursive
          terraform -chdir=infra/github init -backend=false -input=false
          terraform -chdir=infra/github validate
          terraform -chdir=infra/cloudflare fmt -check -recursive
          terraform -chdir=infra/cloudflare init -backend=false -input=false
          terraform -chdir=infra/cloudflare validate

      - name: Restore generated Kusto documentation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: static/kusto-docs
          key: kusto-docs-${{ runner.os }}-${{ hashFiles('scripts/generate-kusto-documentation-index.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Build the KQL translator WebAssembly
        run: npm run build:kql-wasm

      - name: Install the Playwright browser
        run: npm run test:e2e:install

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Validate and build the Cloudflare target
        run: KITE_BUILD_TARGET=cloudflare npm run test:ci

      - name: Validate the Cloudflare deployment bundle
        run: |
          test -f .svelte-kit/cloudflare/_worker.js
          test -f .svelte-kit/cloudflare-tmp/manifest.js
          test -f .svelte-kit/output/server/index.js
          test -f .svelte-kit/tsconfig.json
          test -f .svelte-kit/cloudflare/kql-wasm/_framework/dotnet.js
          duckdb_runtime_wasm="$(find .svelte-kit/cloudflare -type f \( -name 'duckdb-eh*.wasm' -o -name 'duckdb-mvp*.wasm' \) -print -quit)"
          test -z "$duckdb_runtime_wasm" || {
            echo "Cloudflare bundle unexpectedly contains DuckDB runtime WASM: $duckdb_runtime_wasm" >&2
            exit 1
          }
          oversized_file="$(find .svelte-kit/cloudflare -type f -size +25M -print -quit)"
          test -z "$oversized_file" || {
            echo "Cloudflare Pages limit exceeded (25 MiB): $oversized_file" >&2
            exit 1
          }

      - name: Upload the preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kite-preview
          path: |
            .svelte-kit/cloudflare
            .svelte-kit/cloudflare-tmp
            .svelte-kit/output/server
            .svelte-kit/tsconfig.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  container:
    name: Validate container image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the prospective merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Install the Playwright browser
        run: npm run test:e2e:install

      - name: Build the container image
        run: docker build -t kite:ci .

      - name: Validate the image user and bundled assets
        run: |
          image_user="$(docker image inspect --format '{{.Config.User}}' kite:ci)"
          test -n "$image_user" && test "$image_user" != "0" && test "$image_user" != "root" || {
            echo "Container image must declare a non-root user; found '${image_user:-unset}'" >&2
            exit 1
          }
          docker run --rm --entrypoint /bin/sh kite:ci -c '
            test "$(id -u)" -ne 0 &&
            test -n "$(find /usr/share/nginx/html/_app/immutable/assets -type f -name "duckdb-eh.*.wasm" -print -quit)" &&
            test -n "$(find /usr/share/nginx/html/_app/immutable/assets -type f -name "duckdb-mvp.*.wasm" -print -quit)" &&
            test -n "$(find /usr/share/nginx/html/_app/immutable/assets -type f -name "duckdb-browser-eh.worker.*.js" -print -quit)" &&
            test -n "$(find /usr/share/nginx/html/_app/immutable/assets -type f -name "duckdb-browser-mvp.worker.*.js" -print -quit)"
          '

      - name: Start the container
        run: docker run --detach --name kite-container-ci --publish 127.0.0.1:3000:8080 kite:ci

      - name: Check direct application routes and translator asset
        run: |
          routes="/ /admin /admin/commands /admin/databases /admin/ingestion /explorer /explorer/query /explorer/query/saved /labs/kql-to-sql"
          for route in $routes; do
            curl --fail --silent --show-error --retry 10 --retry-connrefused "http://127.0.0.1:3000$route" --output /dev/null
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/kql-wasm/_framework/dotnet.js --output /dev/null

      - name: Run the DuckDB and KQL browser scenario
        env:
          KITE_E2E_FORBID_REQUEST_HOST: cdn.jsdelivr.net
          KITE_E2E_REQUIRE_LOCAL_DUCKDB_ASSETS: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_EXTERNAL_SERVER: 'true'
        run: >-
          npx playwright test tests/app.e2e.ts
          --grep "serves every application route after a direct browser reload|translates KQL to DuckDB SQL and executes it in the browser"

      - name: Stop the container
        if: always()
        run: |
          docker logs kite-container-ci || true
          docker rm --force kite-container-ci || true
