name: Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the prospective merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/github fmt -check -recursive
          terraform -chdir=infra/github init -backend=false -input=false
          terraform -chdir=infra/github validate
          terraform -chdir=infra/cloudflare fmt -check -recursive
          terraform -chdir=infra/cloudflare init -backend=false -input=false
          terraform -chdir=infra/cloudflare validate

      - name: Restore generated Kusto documentation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: static/kusto-docs
          key: kusto-docs-${{ runner.os }}-${{ hashFiles('scripts/generate-kusto-documentation-index.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npm run test:e2e:install

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Validate and build
        run: npm run test:ci

      - name: Upload the preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kite-preview
          path: .svelte-kit/cloudflare
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
