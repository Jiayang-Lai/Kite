name: Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}

    steps:
      - name: Check out the prospective merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/github fmt -check -recursive
          terraform -chdir=infra/github init -backend=false -input=false
          terraform -chdir=infra/github validate
          terraform -chdir=infra/cloudflare fmt -check -recursive
          terraform -chdir=infra/cloudflare init -backend=false -input=false
          terraform -chdir=infra/cloudflare validate

      - name: Restore generated Kusto documentation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: static/kusto-docs
          key: kusto-docs-${{ runner.os }}-${{ hashFiles('scripts/generate-kusto-documentation-index.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npm run test:e2e:install

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Validate and build
        run: npm run test:ci

      - name: Upload the preview artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kite-preview-${{ github.sha }}
          path: .svelte-kit/cloudflare
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  preview:
    name: Deploy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependencies
        run: npm ci --ignore-scripts

      - name: Download the preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: site
          digest-mismatch: error

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Apply the GitHub Terraform to set the repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN preview environment secret}"
          : "${CLOUDFLARE_PAGES_PROJECT_NAME:?Apply the GitHub Terraform to set the repository variable}"

      - name: Deploy the preview
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: >-
            pages deploy site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.sha }}
            --commit-message="Preview PR #${{ github.event.pull_request.number }}"
            --commit-dirty=false
