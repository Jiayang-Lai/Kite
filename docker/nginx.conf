server {
	listen 8080;
	listen [::]:8080;
	server_name _;
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	include /etc/nginx/snippets/kite-security-headers.conf;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location ^~ /_app/immutable/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		include /etc/nginx/snippets/kite-security-headers.conf;
	}

	location ~* \.wasm$ {
		try_files $uri =404;
		default_type application/wasm;
		add_header Cache-Control "public, max-age=31536000, immutable";
		include /etc/nginx/snippets/kite-security-headers.conf;
	}

	location ~* \.html$ {
		try_files $uri =404;
		add_header Cache-Control "no-cache";
		include /etc/nginx/snippets/kite-security-headers.conf;
	}

	location / {
		try_files $uri.html $uri $uri/ =404;
		add_header Cache-Control "no-cache";
		include /etc/nginx/snippets/kite-security-headers.conf;
	}
}
