# Included by every location in nginx.conf. nginx drops server-level add_header
# directives from any location that declares its own, so these must not live there.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
# Generated by scripts/generate-csp-headers.mjs during the image build.
include /etc/nginx/snippets/kite-csp.conf;
